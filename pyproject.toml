[project]
name = "pycopymcp"
version = "0.1.0"
description = "MCP server that lets an AI agent copy text to the clipboard"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["mcp", "clipboard", "agent"]
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
pycopymcp = "pycopymcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycopymcp"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
