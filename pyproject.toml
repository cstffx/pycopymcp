[project]
name = "pycopymcp"
version = "0.1.0"
description = "MCP server cuya única finalidad es copiar contenido al portapapeles"
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "clipboard", "portapapeles"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
pycopymcp = "pycopymcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycopymcp"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
